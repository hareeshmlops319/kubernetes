# Base Helm values for the NVIDIA GPU Operator, shared by every cluster.
# Chart: nvidia/gpu-operator (version pinned in the Argo CD Application/ApplicationSet).
# Per-cluster overrides live in values/clusters/<cluster-name>.yaml.

operator:
  # Argo CD applies the chart's crds/ directory on every sync (unlike `helm upgrade`),
  # so the chart's pre-upgrade CRD hook Job is redundant under GitOps.
  upgradeCRD: false
  cleanupCRD: false

nfd:
  enabled: true            # set false if Node Feature Discovery is already installed

cdi:
  enabled: true

driver:
  enabled: true
  kernelModuleType: auto   # auto | open | proprietary
  # version: "<driver-version>"   # pin a production-branch driver; defaults to the chart's
  upgradePolicy:
    autoUpgrade: true
    maxParallelUpgrades: 1
    maxUnavailable: 25%
    waitForCompletion:
      timeoutSeconds: 0
      podSelector: ""
    gpuPodDeletion:
      force: false
      timeoutSeconds: 300
      deleteEmptyDir: true
    drain:
      enable: true
      force: false
      timeoutSeconds: 300
      deleteEmptyDir: true

toolkit:
  enabled: true

mig:
  strategy: single         # single | mixed

# GPU sharing profiles, rendered by the chart into a ConfigMap. The device plugin
# uses `default` cluster-wide; label a node with
#   nvidia.com/device-plugin.config=<profile>
# to pick a different profile on that node.
devicePlugin:
  enabled: true
  config:
    create: true
    name: device-plugin-config
    default: no-sharing
    data:
      no-sharing: |-
        version: v1
        flags:
          migStrategy: single
      time-sliced-4: |-
        version: v1
        flags:
          migStrategy: single
        sharing:
          timeSlicing:
            renameByDefault: false
            failRequestsGreaterThanOne: true
            resources:
              - name: nvidia.com/gpu
                replicas: 4
      mps-4: |-
        version: v1
        flags:
          migStrategy: single
        sharing:
          mps:
            renameByDefault: false
            resources:
              - name: nvidia.com/gpu
                replicas: 4

# MIG layouts. Nodes opt in with the label nvidia.com/mig.config=<layout>.
migManager:
  enabled: true
  config:
    create: true
    name: custom-mig-config
    default: all-disabled
    data:
      config.yaml: |-
        version: v1
        mig-configs:
          all-disabled:
            - devices: all
              mig-enabled: false
          all-1g.10gb:
            - devices: all
              mig-enabled: true
              mig-devices:
                "1g.10gb": 7
          all-3g.40gb:
            - devices: all
              mig-enabled: true
              mig-devices:
                "3g.40gb": 2
          inference-training-split:
            - devices: [0, 1, 2, 3]
              mig-enabled: true
              mig-devices:
                "1g.10gb": 3
                "2g.20gb": 2
            - devices: [4, 5, 6, 7]
              mig-enabled: false

dcgm:
  enabled: true

# DCGM exporter with profiling metrics (SM active/occupancy, tensor pipe, DRAM, PCIe, NVLink).
dcgmExporter:
  enabled: true
  config:
    create: true
    name: dcgm-metrics
    data: |-
      DCGM_FI_DEV_GPU_UTIL,            gauge,   GPU utilization (%)
      DCGM_FI_DEV_FB_USED,             gauge,   Framebuffer used (MiB)
      DCGM_FI_DEV_FB_FREE,             gauge,   Framebuffer free (MiB)
      DCGM_FI_DEV_POWER_USAGE,         gauge,   Power draw (W)
      DCGM_FI_DEV_GPU_TEMP,            gauge,   GPU temperature (C)
      DCGM_FI_DEV_SM_CLOCK,            gauge,   SM clock (MHz)
      DCGM_FI_DEV_XID_ERRORS,          gauge,   Last XID error
      DCGM_FI_DEV_ECC_DBE_VOL_TOTAL,   counter, Volatile double-bit ECC errors
      DCGM_FI_PROF_GR_ENGINE_ACTIVE,   gauge,   Graphics engine active ratio
      DCGM_FI_PROF_SM_ACTIVE,          gauge,   SM active ratio
      DCGM_FI_PROF_SM_OCCUPANCY,       gauge,   SM occupancy ratio
      DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge,   Tensor pipe active ratio
      DCGM_FI_PROF_DRAM_ACTIVE,        gauge,   DRAM active ratio
      DCGM_FI_PROF_PCIE_TX_BYTES,      gauge,   PCIe TX bytes/s
      DCGM_FI_PROF_PCIE_RX_BYTES,      gauge,   PCIe RX bytes/s
      DCGM_FI_PROF_NVLINK_TX_BYTES,    gauge,   NVLink TX bytes/s
      DCGM_FI_PROF_NVLINK_RX_BYTES,    gauge,   NVLink RX bytes/s
  serviceMonitor:
    enabled: true          # needs Prometheus Operator CRDs on the cluster
    interval: 15s

gfd:
  enabled: true

daemonsets:
  priorityClassName: system-node-critical
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
